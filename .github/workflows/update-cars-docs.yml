name: Update CARS.md

on:
  workflow_dispatch:

jobs:
  update-cars:
    if: false  # disabled until the CARS.md update workflow is fixed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Car Docs
        run: |
          pip install -e .
          scons -c && scons -j$(nproc)
          python -m pip install jinja2==3.1.4
          python opendbc/car/docs.py
      - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842
        with:
          commit_message: 'docs: Scheduled auto-update CARS.md'
          file_pattern: 'docs/CARS.md'
          
